<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6a2cc4">
<title>Sweetverse – Match &amp; Magic</title>
<!-- SWEETVERSE playable prototype. Built 2026-11-14 (v0.2). -->
<style>/*CSS*/</style>
</head>
<body>
<section id="home" class="screen">
  <div class="bg"></div><div class="sparkles"></div>
  <div class="logo">SWEET<br>VERSE</div>
  <div class="sub">Match &amp; Magic</div>
  <div class="story">Grumble the Gumdrop Troll has scattered the magic sweets of the Sweetverse. Help Pip the sugar sprite win them back across three lands.</div>
  <button class="btn green" id="playBtn" style="font-size:24px;padding:16px 56px">Play</button>
  <button class="btn blue small" id="homeSettings">⚙️ Settings</button>
</section>

<section id="map" class="screen hidden">
  <div class="bg"></div><div class="sparkles"></div>
  <div class="topbar">
    <button class="icon-btn" id="mapHome" aria-label="Home">🏠</button>
    <div class="title">World Map</div>
    <div class="pill">⭐ <span id="starTotal">0</span></div>
    <button class="icon-btn" id="mapSettings" aria-label="Settings">⚙️</button>
  </div>
  <div id="mapScroll"></div>
</section>

<section id="game" class="screen hidden">
  <div class="bg" id="gameBg"></div><div class="sparkles"></div>
  <div class="hud">
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸</button>
    <div class="hud-box" id="movesBox"><div class="lbl" id="movesLbl">Moves</div><div class="val" id="movesVal">0</div></div>
    <div class="hud-box scorewrap"><div class="lbl">Level <span id="lvlNum">1</span> · Score</div><div class="val" id="scoreVal">0</div>
      <div class="starbar"><div class="fill" id="starFill"></div><div id="starMarks"></div></div></div>
  </div>
  <div class="goals" id="goalRow"></div>
  <div class="boardArea">
    <div id="boardWrap">
      <div id="modeHint" class="modeHint hidden">🔨 Tap a sweet to smash it</div>
      <div id="board"><div id="tiles"></div><div id="overlay"></div><div id="fx"></div></div>
    </div>
  </div>
  <div class="boosters">
    <button class="booster" id="bHammer" aria-label="Sweet Hammer"><span class="nm">Hammer</span>🔨<span class="cnt">0</span></button>
    <button class="booster" id="bShuffle" aria-label="Shuffle Magic"><span class="nm">Shuffle</span>🔀<span class="cnt">0</span></button>
    <button class="booster" id="bMoves" aria-label="Extra Moves"><span class="nm">+5 moves</span>➕<span class="cnt">0</span></button>
  </div>
</section>

<div id="modal" class="hidden"></div>
<script>/*ENGINE*/</script>
<script>/*LEVELS*/</script>
<script>/*UI*/</script>
</body>
</html>
